<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#000000">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Bastion">
  <title>Dernier Bastion</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="style.css?v=12">
</head>
<body>
  <!-- Zone de jeu : respecte l'encoche via les marges de sécurité (voir style.css) -->
  <div id="wrap"><canvas id="game"></canvas></div>

  <!-- Affiché uniquement sur téléphone tenu en portrait -->
  <div id="rotate">
    <div class="phone"></div>
    <p>Tourne ton téléphone</p>
    <small>Dernier Bastion se joue en mode paysage</small>
  </div>

  <noscript>Active JavaScript pour jouer à Dernier Bastion.</noscript>
  <script type="module" src="src/main.js?v=12"></script>
  <script>
    // Application installable + jeu disponible hors connexion (voir sw.js)
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('sw.js?v=12').catch(function () {});
      });
    }
  </script>
</body>
</html>
